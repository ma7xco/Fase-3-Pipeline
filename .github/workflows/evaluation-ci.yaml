name: CI evaluation-service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'evaluation-service/evaluator.go'
jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./evaluation-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Application
        run: go build -v ./...

      - name: Run Unit Tests
        run: go test -v ./...

  lint:
    name: Linting
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./evaluation-service
        
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Analysing the code with golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.57.2

  Scan-de-Seguranca-SCA:
    name: Scan-de-Seguranca (SCA)
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: ./evaluation-service
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Software Composition Analysis - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          vuln-type: library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

